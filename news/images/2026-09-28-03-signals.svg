<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 160" width="640" height="160">
  <!-- 2026-09-28 item 3: a text line marked, and a note that shows which signals were used. -->
  <style>
    .bg{fill:#E7EBE9}
    .muted{fill:none;stroke:#4A5B62;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}
    .ink{fill:none;stroke:#10202B;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}
    .teal{fill:none;stroke:#0E7C7B;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
    .teal-fill{fill:#0E7C7B}
    .brass{fill:none;stroke:#8F6423;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
    .brass-fill{fill:#8F6423}
    .mark{fill:none;stroke:#0E7C7B;stroke-width:3.5;stroke-linecap:round}
    .wash-teal{fill:#0E7C7B;opacity:.16}
    @media (prefers-color-scheme: dark){
      .bg{fill:#16262F}
      .muted{stroke:#A9B8B6}
      .ink{stroke:#EDF2F1}
      .teal{stroke:#3BC0BB}
      .teal-fill{fill:#3BC0BB}
      .brass{stroke:#D9A054}
      .brass-fill{fill:#D9A054}
      .mark{stroke:#3BC0BB}
      .wash-teal{fill:#3BC0BB}
    }
  </style>
  <rect width="640" height="160" class="bg"/>
  <path d="M64 40 H300" class="muted"/>
  <path d="M64 66 H248" class="muted"/>
  <path d="M64 92 H328" class="mark"/>
  <path d="M64 102 H328" class="brass"/>
  <path d="M48 80 V112" class="brass"/>
  <path d="M48 80 H60 M48 112 H60" class="brass"/>
  <path d="M64 118 H196" class="muted"/>
  <path d="M64 144 H268" class="muted"/>
  <path d="M328 92 H368 V78 H412" class="ink" stroke-dasharray="2 7"/>
  <rect x="412" y="30" width="188" height="100" rx="6" class="wash-teal"/>
  <rect x="412" y="30" width="188" height="100" rx="6" class="teal"/>
  <circle cx="438" cy="56" r="5" class="brass-fill"/>
  <path d="M454 56 H572" class="muted"/>
  <circle cx="438" cy="80" r="5" class="teal-fill"/>
  <path d="M454 80 H548" class="muted"/>
  <circle cx="438" cy="104" r="5" class="brass-fill"/>
  <path d="M454 104 H564" class="muted"/>
</svg>
