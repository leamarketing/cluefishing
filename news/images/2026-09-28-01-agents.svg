<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 160" width="640" height="160">
  <!-- 2026-09-28 item 1: two paper-agents and the genetic link they found. -->
  <style>
    .bg{fill:#E7EBE9}
    .muted{fill:none;stroke:#4A5B62;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
    .ink{fill:none;stroke:#10202B;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}
    .teal{fill:none;stroke:#0E7C7B;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
    .brass{fill:none;stroke:#8F6423;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
    .brass-fill{fill:#8F6423}
    .wash-brass{fill:#8F6423;opacity:.14}
    .wash-teal{fill:#0E7C7B;opacity:.16}
    @media (prefers-color-scheme: dark){
      .bg{fill:#16262F}
      .muted{stroke:#A9B8B6}
      .ink{stroke:#EDF2F1}
      .teal{stroke:#3BC0BB}
      .brass{stroke:#D9A054}
      .brass-fill{fill:#D9A054}
      .wash-brass{fill:#D9A054}
      .wash-teal{fill:#3BC0BB}
    }
  </style>
  <rect width="640" height="160" class="bg"/>
  <rect x="48" y="28" width="168" height="104" rx="6" class="wash-brass"/>
  <rect x="48" y="28" width="168" height="104" rx="6" class="brass"/>
  <path d="M70 52 H190 M70 72 H168 M70 92 H184 M70 112 H142" class="muted"/>
  <rect x="424" y="28" width="168" height="104" rx="6" class="wash-teal"/>
  <rect x="424" y="28" width="168" height="104" rx="6" class="teal"/>
  <path d="M446 52 H566 M446 72 H544 M446 92 H560 M446 112 H518" class="muted"/>
  <path d="M216 78 C 268 30, 372 30, 424 78" class="ink" stroke-dasharray="2 8"/>
  <path d="M320 22 L324 34 L336 38 L324 42 L320 54 L316 42 L304 38 L316 34 Z" class="brass-fill"/>
  <path d="M300 96 C 320 96, 320 136, 340 136" class="teal"/>
  <path d="M340 96 C 320 96, 320 136, 300 136" class="brass"/>
  <path d="M305 106 H335 M303 116 H337 M305 126 H335" class="muted"/>
</svg>
