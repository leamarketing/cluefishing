<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@800;900&family=Source+Serif+4:wght@400;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{ --bg:#F2F4F3; --surface:#FFFFFF; --ink:#10202B; --ink-soft:#4A5B62; --teal-strong:#095F5E; --border:#D7DEDC; }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){ --bg:#0B1620; --surface:#10202B; --ink:#EDF2F1; --ink-soft:#A9B8B6; --teal-strong:#63D4D0; --border:#22343C; }
  }
  :root[data-theme="dark"]{ --bg:#0B1620; --surface:#10202B; --ink:#EDF2F1; --ink-soft:#A9B8B6; --teal-strong:#63D4D0; --border:#22343C; }
  *{box-sizing:border-box;}
  body{margin:0; background:var(--bg); color:var(--ink); font-family:"Source Serif 4", Georgia, serif; padding-inline:20px;}
  a{color:var(--teal-strong);}
  .wrap{max-width:640px; margin-inline:auto; padding-block:48px;}
  .eyebrow{font-family:"IBM Plex Mono", monospace; text-transform:uppercase; letter-spacing:.12em; font-size:12px; color:var(--ink-soft);}
  h1{font-family:"Big Shoulders Display", sans-serif; font-weight:900; text-transform:uppercase; font-size:clamp(28px,6vw,42px); margin:10px 0 24px;}
  .back{font-family:"IBM Plex Mono", monospace; font-size:12.5px; text-decoration:none;}
  ul{list-style:none; margin:0; padding:0; border:1px solid var(--border); border-radius:6px; overflow:hidden; background:var(--surface);}
  li a{display:block; padding:14px 18px; font-family:"IBM Plex Mono", monospace; font-size:14px; text-decoration:none; color:var(--ink); border-bottom:1px solid var(--border);}
  li:last-child a{border-bottom:none;}
  li a:hover{color:var(--teal-strong);}
</style>
</head>
<body>
<div class="wrap">
