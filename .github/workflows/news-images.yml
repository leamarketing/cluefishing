name: News image validation

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  news-images:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check article and homepage images
        run: python3 scripts/check_news_images.py
      - name: Check that incomplete editions are rejected
        run: python3 -m unittest discover -s tests
